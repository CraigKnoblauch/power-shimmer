name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: Format, Clippy, Build, Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install Linux tray dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libgtk-3-dev libayatana-appindicator3-dev

      - name: Install overlay test dependencies
        run: sudo apt-get install -y xvfb

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Build
        run: cargo build --workspace --all-targets

      - name: Test
        run: cargo test --workspace --all-targets

      - name: Overlay window placement contract (Xvfb, PR gate, no GPU)
        run: |
          Xvfb :99 -screen 0 1920x1080x24 &
          echo "XVFB_PID=$!" >> "$GITHUB_ENV"
          sleep 1
          DISPLAY=:99 \
            cargo test -p power-shimmer-platform-linux overlay_window_placement_contract -- --ignored --nocapture

      - name: Overlay full placement contract (Xvfb + software GL, optional GPU path)
        run: |
          sudo apt-get install -y libgl1-mesa-dri
          DISPLAY=:99 LIBGL_ALWAYS_SOFTWARE=1 \
            cargo test -p power-shimmer-platform-linux overlay_placement_contract -- --ignored --nocapture
      - name: Stop Xvfb
        if: always()
        run: |
          if [ -n "${XVFB_PID:-}" ]; then
            kill "$XVFB_PID" || true
          fi

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
