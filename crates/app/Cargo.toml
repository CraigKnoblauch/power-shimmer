[package]
name = "power-shimmer-app"
description = "Power Shimmer desktop application (composition root)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "power-shimmer"
path = "src/main.rs"

[lib]
name = "power_shimmer_app"
path = "src/lib.rs"

[dependencies]
power-shimmer-core = { path = "../core" }
power-shimmer-platform-linux = { path = "../platform-linux", optional = true }
power-shimmer-platform-windows = { path = "../platform-windows", optional = true }
power-shimmer-platform-macos = { path = "../platform-macos", optional = true }
clap = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time", "signal"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tray-icon = { workspace = true, optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = { version = "0.18", optional = true }

[features]
default = ["linux", "tray"]
linux = ["dep:power-shimmer-platform-linux"]
tray = ["dep:tray-icon", "dep:gtk"]
windows = ["dep:power-shimmer-platform-windows"]
macos = ["dep:power-shimmer-platform-macos"]

[dev-dependencies]
tempfile = "3"

[target.'cfg(target_os = "linux")'.dev-dependencies]
gtk = "0.18"

[lints]
workspace = true
