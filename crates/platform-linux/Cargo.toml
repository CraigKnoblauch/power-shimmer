[package]
name = "power-shimmer-platform-linux"
description = "Linux platform adapters for Power Shimmer (UPower, X11 overlay)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
power-shimmer-core = { path = "../core" }
power-shimmer-overlay-contract = { path = "../overlay-contract" }
futures-lite = "2"
tokio = { workspace = true, features = ["sync", "time"] }
tracing = { workspace = true }
zbus = { workspace = true }
winit = { workspace = true, default-features = false, features = ["x11", "rwh_06"] }
wgpu = { workspace = true }
raw-window-handle = { workspace = true }
bytemuck = { workspace = true }
pollster = { workspace = true }
x11rb = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }

[features]
default = []
wayland = []

[lints]
workspace = true
